name: "Build and deploy to GH pages site"

on:
  push:

permissions: 
  contents: write
  pages: write

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v6

      - name: Install and build
        run : |
          npm i
          npm run build

      - name: Deploy
        uses:  JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
